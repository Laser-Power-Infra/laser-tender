services:
  laser-tender:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # Replaced 'build:' with the GHCR image
    image: ghcr.io/laser-power-infra/laser-tender:${APP_VERSION:-latest}

    container_name: laser-tender
    ports:
      - "4173:4173"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 4173
      HOSTNAME: 0.0.0.0

      # Path inside the container: type test certificates (same volume and path as tender-executive-dashboard)
      TYPE_TEST_FILES_PATH: /mnt/condutor/Updated TTR

    volumes:
      - condutor:/mnt/condutor:ro

    restart: unless-stopped

    networks:
      - infra

volumes:
  condutor:
    external: true
    name: infrastructure_condutor


networks:
  infra:
    external: true